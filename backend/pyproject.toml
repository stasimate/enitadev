[project]
name = "enita-backend"
version = "0.1.0"
description = "Enita - AI language-learning simulator (backend: agent, MCP server, API)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datapizza-ai>=0.1.0",
    "datapizza-ai-clients-openai",
    "datapizza-ai-clients-google",
    "datapizza-ai-clients-anthropic",
    "datapizza-ai-clients-openai-like",
    "datapizza-ai-embedders-openai",
    "datapizza-ai-vectorstores-qdrant",
    "mcp[cli]>=1.20,<2",  # datapizza MCPClient is not compatible with mcp 2.x
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "ragas>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enita"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
