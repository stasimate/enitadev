# Production-like run with one image. FastAPI serves the API and the Angular build.
#   docker compose up --build   → http://localhost:8000
# For development with hot reload, use compose.dev.yaml.

services:
  enita:
    build: .
    image: enita:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - enita-data:/app/backend/data

volumes:
  enita-data:
