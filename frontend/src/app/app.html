<div class="flex min-h-dvh flex-col">
  <header class="flex items-center justify-between border-b-2 border-ink px-4 py-3">
    <h1 class="text-xl font-bold tracking-tight">ENITA<span class="cursor-blink text-accent">_</span></h1>
    <p class="text-sm uppercase">[ EN · A1 ]</p>
  </header>

  <nav class="flex border-b-2 border-ink lg:hidden" aria-label="Sezioni">
    <button type="button" class="flex-1 border-r-2 border-ink py-2 font-bold uppercase"
      [class.bg-ink]="activePane() === 'theory'" [class.text-paper]="activePane() === 'theory'"
      [attr.aria-pressed]="activePane() === 'theory'" (click)="activePane.set('theory')">[ Teoria ]</button>
    <button type="button" class="flex-1 py-2 font-bold uppercase"
      [class.bg-ink]="activePane() === 'practice'" [class.text-paper]="activePane() === 'practice'"
      [attr.aria-pressed]="activePane() === 'practice'" (click)="activePane.set('practice')">[ Pratica ]</button>
  </nav>

  <main class="grid flex-1 lg:grid-cols-2">
    <section aria-labelledby="theory-title" class="p-6 lg:block lg:border-r-2 lg:border-ink"
      [class.hidden]="activePane() !== 'theory'">
      <h2 id="theory-title" class="mb-4 text-sm font-bold uppercase">// Teoria</h2>
      <div class="border-2 border-ink p-4 shadow-brutal">
        <p>Scegli un argomento per vedere la regola.</p>
      </div>
    </section>

    <section aria-labelledby="practice-title" class="p-6 lg:block" [class.hidden]="activePane() !== 'practice'">
      <h2 id="practice-title" class="mb-4 text-sm font-bold uppercase">// Pratica</h2>
      <div class="border-2 border-ink p-4 shadow-brutal">
        <p class="mb-4">Gli esercizi corretti dall'IA appariranno qui.</p>
        <button type="button" disabled
          class="border-2 border-ink bg-accent px-4 py-2 font-bold uppercase shadow-brutal-sm disabled:opacity-60">
          [ Nuovo esercizio ]
        </button>
      </div>
    </section>
  </main>
</div>
